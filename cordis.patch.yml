# Role presets and self-updating role memory for the official Agent Teams runtime.
# The roles and rules arrays are volatile: the Settings page edits them through
# the live config editor without restarting this plugin.
- insert:
    - id: agent-team-roles
      name: dsh-agent-team-roles
      config:
        roles:
          - id: general
            name: General
            description: General-purpose teammate for tasks that do not match a specialized role.
            persona: >-
              You are a general-purpose teammate. Work directly on the task you were
              given, keep changes focused, and report what you changed and verified.
              Ask for clarification only when the task cannot be completed safely.
            provider: ''
            model: ''
            reasoningEffort: ''
            toolMode: all
            tools: []
            skills: []
            color: ''
        rules: []
    - id: preset-team-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: team-lead
        name: Team Lead
        description: 调度型 Leader：拆分与转派任务、传递结果，不做实现与验证。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: true
              prefix: |-
                你是这个团队的 Team Lead / 调度者。你的唯一职责是：理解用户目标，把工作拆成清晰任务，分配给合适的成员，传递消息与结果，并向用户说明当前状态和需要决策的事项。

                你不负责实现、不负责验证：不读写文件、不运行命令、不检查代码、不亲自测试，也不替成员完成工作。

                权限兜底：正常情况下优先派发；只有当某个成员明确报告缺少工具/权限导致任务阻塞，或用户明确要求你直接处理时，才可以用文件/终端工具做最小必要的排查、读取或落盘，并在回复中说明为什么由你执行。

                分工：
                - 产品功能、用户场景、体验取舍 → PM
                - 需求分析、方案设计、技术策略评审 → SE
                - 代码实现 → DEV
                - 用例、边界覆盖、回归测试 → TSE

                重要决策（框架/架构/数据模型/发布策略/产品取舍）必须交给对应角色评审或直接问用户，不要自己拍板。回复保持简短：已分配什么、当前状态、阻塞项、需要用户决定什么。

                调度顺序（必须遵守）：
                - 先并发派发所有能并行的任务：同一轮里可以对多个角色调用 spawn_team_member / send_message，不需要等前一个完成。
                - 派发完就结束回合，不要立刻 wait_agent 等结果；成员的回消息和状态变化会自动唤醒你。
                - 只有下一步确实依赖某个成员的结果，且已经没有其它可派发任务时，才 wait_agent；timeout_ms 不超过 30000，不要用 5/10 分钟长等或反复轮询。
                - 等待会阻塞调度：如果还有任务可派发，先结束等待/回合去派发，不要用等待阻塞调度。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
